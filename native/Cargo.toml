[package]
name = "jia_native"
version = "0.1.0"
edition = "2021"

[dependencies]
vella = { path = "../../Vella" }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros", "json", "ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
uuid = { version = "1.8", features = ["v4"] }
regex = "1.10"
scylla = "0.13"
sgp4 = "0.3"
num-complex = "0.4"
cid = "0.11"
multihash = "0.19"
memmap2 = "0.9"
tokio-modbus = "0.14"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
redis = { version = "0.25", features = ["tokio-comp"] }
object_store = { version = "0.9", features = ["aws"] }
bytes = "1.4"
rhai = { version = "1.18", features = ["serde", "sync"] }
tokio-cron-scheduler = "0.10"
text-splitter = "0.13"
reqwest = { version = "0.11", features = ["json"] }
opentelemetry = "0.22"
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.15", features = ["tonic"] }
tracing-opentelemetry = "0.23"
tower = "0.5"
thiserror = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "postgres", "mysql", "chrono"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.30.0"
yrs = "0.27.4"
sysinfo = "0.39.6"
tfhe = { version = "1.7.0", features = ["boolean", "integer", "shortint"] }
bellman = "0.14.0"
bls12_381 = "0.8.0"
rust-hdl = "0.46.0"
num-traits = "0.2.19"
libc = "0.2"

# ── Real Post-Quantum Cryptography (NIST FIPS 203 / 204) ────────────────────
ml-kem = { version = "0.2", features = ["std"] }
ml-dsa = { version = "0.1", features = ["getrandom", "pkcs8"] }

# ── Real WebAuthn ECDSA Signature Verification ─────────────────────────────
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ciborium = "0.2"

# ── Real Kernel Process Monitoring ─────────────────────────────────────────
procfs = { version = "0.16", default-features = false }
inotify = "0.10"

# ── ZK Proof (ff primitives already pulled in by bellman/bls12_381) ─────────
ff = "0.13"
